name: SHM-EM CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  frontend:
    name: Frontend build
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  backend:
    name: Backend tests
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8
          cache: maven
      - run: mvn test
      - run: mvn -DskipTests package

  prediction-runtime:
    name: Prediction runtime tests
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src/pit_pre
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: src/pit_pre/requirements.lock.txt
      - run: python -m pip install -r requirements.lock.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q pit_pre tests
