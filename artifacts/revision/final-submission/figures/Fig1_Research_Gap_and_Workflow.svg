    <text x="2945" y="1692" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="400" fill="#5e6b80" text-anchor="start"><tspan x="2945" dy="0">Formal records and evidence</tspan></text><rect x="2915" y="1880" width="1130" height="100" rx="16" fill="#ffffff" stroke="#087f83" stroke-width="4"/><text x="3480" y="1944" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#087f83" text-anchor="middle"><tspan x="3480" dy="0">Blocked eligibility produces no formal event side effects</tspan></text>
