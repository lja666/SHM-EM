    <text x="185" y="348" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" fill="#172033" text-anchor="start"><tspan x="185" dy="0">Heterogeneous observations</tspan></text>
    <text x="185" y="402" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="400" fill="#5e6b80" text-anchor="start"><tspan x="185" dy="0">Displacement, settlement, pressure,</tspan><tspan x="185" dy="40">water level, strain, and vibration</tspan></text><line x1="650" y1="555" x2="650" y2="685" stroke="#d66a00" stroke-width="10" marker-end="url(#arrow)"/><rect x="155" y="695" width="990" height="265" rx="20" fill="#ffffff" stroke="#d66a00" stroke-width="5"/>
    <text x="185" y="753" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" fill="#172033" text-anchor="start"><tspan x="185" dy="0">Project-bound model scripts</tspan></text>
    <text x="185" y="807" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="400" fill="#5e6b80" text-anchor="start"><tspan x="185" dy="0">Implicit feature order, units,</tspan><tspan x="185" dy="40">identifiers, and temporal assumptions</tspan></text><line x1="650" y1="960" x2="650" y2="1090" stroke="#d66a00" stroke-width="10" marker-end="url(#arrow)"/><rect x="155" y="1100" width="990" height="265" rx="20" fill="#ffffff" stroke="#c62828" stroke-width="5"/>
    <text x="185" y="1158" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" fill="#172033" text-anchor="start"><tspan x="185" dy="0">Disconnected alerts</tspan></text>
    <text x="185" y="1212" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="400" fill="#5e6b80" text-anchor="start"><tspan x="185" dy="0">Forecasts visualized without an</tspan><tspan x="185" dy="40">audited formal-event boundary</tspan></text><rect x="155" y="1510" width="990" height="325" rx="18" fill="#ffffff" stroke="#c62828" stroke-width="5"/><text x="650" y="1585" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" fill="#c62828" text-anchor="middle"><tspan x="650" dy="0">Software gap</tspan></text><text x="650" y="1650" font-family="Arial, Helvetica, sans-serif" font-size="33" font-weight="500" fill="#172033" text-anchor="middle"><tspan x="650" dy="0">How can persisted forecasts become</tspan><tspan x="650" dy="44">contextualized, inspectable, and</tspan><tspan x="650" dy="44">conditionally executable records?</tspan></text><rect x="1380" y="300" width="1300" height="360" rx="20" fill="#ffffff" stroke="#0b3c82" stroke-width="6"/><circle cx="1460" cy="390" r="50" fill="#0b3c82"/><text x="1460" y="406" font-family="Arial, Helvetica, sans-serif" font-size="50" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="1460" dy="0">1</tspan></text><text x="1535" y="383" font-family="Arial, Helvetica, sans-serif" font-size="39" font-weight="700" fill="#0b3c82" text-anchor="start"><tspan x="1535" dy="0">Versioned engineering-semantic contract</tspan></text><text x="1535" y="455" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="500" fill="#172033" text-anchor="start"><tspan x="1535" dy="0">Ordered features and targets</tspan><tspan x="1535" dy="44">Units, transformations, artifacts, hashes</tspan></text><rect x="1380" y="770" width="1300" height="360" rx="20" fill="#ffffff" stroke="#087f83" stroke-width="6"/><circle cx="1460" cy="860" r="50" fill="#087f83"/><text x="1460" y="876" font-family="Arial, Helvetica, sans-serif" font-size="50" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="1460" dy="0">2</tspan></text><text x="1535" y="853" font-family="Arial, Helvetica, sans-serif" font-size="39" font-weight="700" fill="#087f83" text-anchor="start"><tspan x="1535" dy="0">Synchronized Project Future State</tspan></text><text x="1535" y="925" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="500" fill="#172033" text-anchor="start"><tspan x="1535" dy="0">One base time and future timeline</tspan><tspan x="1535" dy="44">Observed and forecast risk remain distinct</tspan></text><rect x="1380" y="1240" width="1300" height="360" rx="20" fill="#ffffff" stroke="#1769e8" stroke-width="6"/><circle cx="1460" cy="1330" r="50" fill="#1769e8"/><text x="1460" y="1346" font-family="Arial, Helvetica, sans-serif" font-size="50" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="1460" dy="0">3</tspan></text><text x="1535" y="1323" font-family="Arial, Helvetica, sans-serif" font-size="39" font-weight="700" fill="#1769e8" text-anchor="start"><tspan x="1535" dy="0">Controlled forecast-to-event transition</tspan></text><text x="1535" y="1395" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="500" fill="#172033" text-anchor="start"><tspan x="1535" dy="0">Audited Evaluate; independently gated Execute</tspan><tspan x="1535" dy="44">Formal event, response, and provenance</tspan></text><rect x="1380" y="1720" width="1300" height="180" rx="18" fill="#ffffff" stroke="#a9bfd9" stroke-width="4"/><text x="2030" y="1792" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#0b3c82" text-anchor="middle"><tspan x="2030" dy="0">Backend-controlled formal side-effect boundary</tspan></text><text x="2030" y="1845" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="500" fill="#5e6b80" text-anchor="middle"><tspan x="2030" dy="0">Forecasting algorithm remains outside the contribution claim</tspan></text><rect x="2915" y="280" width="1130" height="215" rx="20" fill="#ffffff" stroke="#0b3c82" stroke-width="5"/>
