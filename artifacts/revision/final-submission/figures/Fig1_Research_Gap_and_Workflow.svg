    <text x="2945" y="1172" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="400" fill="#5e6b80" text-anchor="start"><tspan x="2945" dy="0">Candidate plus audit run</tspan></text><line x1="3480" y1="1275" x2="3480" y2="1310" stroke="#1769e8" stroke-width="10" marker-end="url(#arrow)"/><rect x="2915" y="1320" width="1130" height="215" rx="20" fill="#ffffff" stroke="#087f83" stroke-width="5"/>
